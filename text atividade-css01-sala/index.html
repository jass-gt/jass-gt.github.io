<html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Evento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Cadastro de Evento</h1>
        <p class="destaque">
            Preencha o formulário para participar do evento acadêmico.
        </p>
    </header>

    <main>
        <section class="secao">
            <form class="formulario">

                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" class="campo-texto" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" class="campo-texto" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" class="campo-texto" required>

                <label for="data">Data de Nascimento</label>
                <input type="date" id="data" name="data" class="campo-texto">

                <label for="curso">Curso</label>
                <select id="curso" name="curso" class="campo-texto">
                    <option>Informática</option>
                    <option>Química</option>
                    <option>Agropecuária</option>
                    <option>Sistemas de Informação</option>
                </select>

                <p>Turno Preferido</p>

                <label>
                    <input type="radio" name="turno" value="manha">
                    Manhã
                </label>

                <label>
                    <input type="radio" name="turno" value="tarde">
                    Tarde
                </label>
         
                <label for="comentario">Comentários</label>
                <textarea id="comentario" name="comentario" class="campo-texto"></textarea>

                <label class="campo-obrigatorio">
                    <input type="checkbox" required>
                    Aceito os termos de participação
                </label>

                <button type="submit" class="botao-principal">
                    Enviar Cadastro
                </button>

            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Integrantes: José Anderson e Brenda Kyara</p>
        <p>Data: 15/06/2026</p>
        <p>Disciplina: Desenvolvimento Web</p>
    </footer>

</body>
</html>
